# Deploys main to GCP after CI passed on it:
#   1. build + push the api, ingestion and web images (linux/amd64)
#   2. `prisma migrate deploy` against Cloud SQL through the Cloud SQL Auth Proxy (stops here on failure)
#   3. `gcloud run deploy` nextera-api and nextera-ingestion
#   4. `gcloud run deploy` nextera-web, only after 3 succeeded (the new frontend may need the new API).
#      The web image has no API URL baked in: Terraform sets API_BASE_URL on the service.
#   5. `gcloud run jobs update` the demo feed job (ingestion image), only if the repository variable
#      DEMO_FEED_JOB is set (Terraform demo_feed_enabled).
#   6. `gcloud run jobs update` the weather sync job (ingestion image), only if the repository variable
#      WEATHER_SYNC_JOB is set (Terraform weather_sync_enabled).
#   7. `gcloud run jobs update` the farm rollup job (ingestion image), only if the repository variable
#      FARM_ROLLUP_JOB is set (Terraform farm_rollup_enabled).
#   Scale jobs (ingestion image; each only if its repository variable is set, Terraform defaults: on):
#      PARTITION_MAINTENANCE_JOB: updated AND executed (--wait) right after the migration, before the
#      services roll out, so the new days' partitions exist first. LIVE_SUMMARY_JOB and
#      ANOMALY_ROLLUP_JOB: updated and executed (--wait) after the services, so the first run is
#      done before the deploy ends (the first anomaly rollup takes about 70 s at 1M turbines).
# Without any of the six required repository variables (an unconfigured repo) the deploy is skipped
# with a notice instead of failing; with only some of them it fails at the variables check.
# Authenticates with Workload Identity Federation (no keys). One-time setup: CLAUDE.md, "Deploying".
# Repository variables come from `terraform output github_actions_variables`.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual re-deploy of main (e.g. after fixing a failed migration).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC token for Workload Identity Federation

# One deploy at a time, so two migrations never run concurrently. Never cancel a running one:
# a migration killed halfway needs a human. (GitHub keeps at most one pending run: the newest.)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Unconfigured repository (no GCP variables yet, e.g. the interview demo): say so instead of a red X.
  # Same trust guard as `deploy`, no permissions, no environment, no credentials.
  not-configured:
    name: Deploy skipped (GCP not configured)
    if: >-
      ((github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
      && vars.GCP_PROJECT_ID == '' && vars.GCP_REGION == '' && vars.GCP_REGISTRY == ''
      && vars.CLOUDSQL_INSTANCE == '' && vars.GCP_WIF_PROVIDER == '' && vars.GCP_DEPLOYER_SA == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Explain the skip
        run: |
          echo "::notice title=Deploy skipped::None of the GCP repository variables are set, so nothing was deployed. See CLAUDE.md, Deploying, One-time setup."
          {
            echo "### Deploy skipped"
            echo "None of the repository variables (GCP_PROJECT_ID, GCP_REGION, GCP_REGISTRY, CLOUDSQL_INSTANCE, GCP_WIF_PROVIDER, GCP_DEPLOYER_SA) are set, so this repository is not configured for GCP and nothing was deployed."
            echo "Set them from the Terraform output \`github_actions_variables\` to enable deploys (CLAUDE.md, Deploying, One-time setup)."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Build, migrate, deploy
    # Only successful CI runs for pushes to main of this repository (not PRs, not forks),
    # or a manual run on main, and only once the repository is configured for GCP: with none of the
    # six required variables set the job is skipped (see `not-configured`). With some set it runs
    # and fails at "Check repository variables": a half-configured repo is a mistake.
    if: >-
      ((github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
      && (vars.GCP_PROJECT_ID != '' || vars.GCP_REGION != '' || vars.GCP_REGISTRY != ''
        || vars.CLOUDSQL_INSTANCE != '' || vars.GCP_WIF_PROVIDER != '' || vars.GCP_DEPLOYER_SA != '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The deployer service account trusts only jobs in this environment (infra/terraform/github.tf).
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_REGISTRY }}
      CLOUDSQL_INSTANCE: ${{ vars.CLOUDSQL_INSTANCE }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
      DEMO_FEED_JOB: ${{ vars.DEMO_FEED_JOB }} # optional: set only while Terraform's demo_feed_enabled is on
      WEATHER_SYNC_JOB: ${{ vars.WEATHER_SYNC_JOB }} # optional: set only while Terraform's weather_sync_enabled is on
      FARM_ROLLUP_JOB: ${{ vars.FARM_ROLLUP_JOB }} # optional: set only while Terraform's farm_rollup_enabled is on
      PARTITION_MAINTENANCE_JOB: ${{ vars.PARTITION_MAINTENANCE_JOB }} # optional: set only while Terraform's partition_maintenance_enabled is on
      LIVE_SUMMARY_JOB: ${{ vars.LIVE_SUMMARY_JOB }} # optional: set only while Terraform's live_summary_enabled is on
      ANOMALY_ROLLUP_JOB: ${{ vars.ANOMALY_ROLLUP_JOB }} # optional: set only while Terraform's anomaly_rollup_enabled is on
      CLOUD_SQL_PROXY_VERSION: v2.26.0
    steps:
      - name: Check repository variables
        run: |
          missing=0
          for name in PROJECT_ID REGION REGISTRY CLOUDSQL_INSTANCE WIF_PROVIDER DEPLOYER_SA; do
            if [ -z "${!name}" ]; then echo "::error::Repository variable for $name is not set"; missing=1; fi
          done
          exit "$missing"

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }} # the commit CI tested, not whatever main is now
          persist-credentials: false # nothing later needs git credentials

      # Before the auth step on purpose: dependency install scripts must never see the GCP
      # credentials (the auth step writes a credentials file and sets GOOGLE_APPLICATION_CREDENTIALS).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installs the Prisma CLI + migration engine (and builds @nextera/shared via `prepare`).
      - run: npm ci

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # --- 1. Images ---------------------------------------------------------------------
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v4

      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/api:${{ env.SHA }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push ingestion
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/ingestion/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/ingestion:${{ env.SHA }}
          cache-from: type=gha,scope=ingestion
          cache-to: type=gha,scope=ingestion,mode=max

      # apps/web is a separate npm project, so its build context is apps/web (not the repo root).
      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/web:${{ env.SHA }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # --- 2. Migrations -------------------------------------------------------------------
      # (npm ci already ran above, deliberately before the credentials existed.)
      # The proxy authenticates as the deployer (roles/cloudsql.client) with the credentials from
      # the auth step, and exposes the instance at /cloudsql/<connection name>/.s.PGSQL.5432: the
      # same socket path Cloud Run mounts, so the `database-url` secret works here unchanged.
      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloud-sql-proxy" \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          chmod +x "$RUNNER_TEMP/cloud-sql-proxy"
          sudo mkdir -p /cloudsql && sudo chown "$(id -u):$(id -g)" /cloudsql
          "$RUNNER_TEMP/cloud-sql-proxy" --unix-socket /cloudsql \
            --health-check --http-address 127.0.0.1 --http-port 9090 \
            "$CLOUDSQL_INSTANCE" > "$RUNNER_TEMP/cloud-sql-proxy.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fs http://127.0.0.1:9090/startup >/dev/null; then echo "Cloud SQL Auth Proxy ready"; exit 0; fi
            sleep 1
          done
          echo "::error::Cloud SQL Auth Proxy did not start"
          cat "$RUNNER_TEMP/cloud-sql-proxy.log"
          exit 1

      # Masked in logs by the action. Only the deployer's accessor binding on this one secret allows it.
      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |-
            DATABASE_URL:${{ env.PROJECT_ID }}/database-url

      - name: prisma migrate deploy
        env:
          DATABASE_URL: ${{ steps.secrets.outputs.DATABASE_URL }}
        run: npm run db:deploy

      - name: Cloud SQL Auth Proxy log
        if: always()
        run: cat "$RUNNER_TEMP/cloud-sql-proxy.log" 2>/dev/null || true

      # --- 2b. Partition maintenance (optional; before the services roll out) ----------------------
      # Creates the next days' telemetry partitions (and drops expired ones) with the NEW image, so
      # ingestion never writes into a missing day. --wait blocks until the execution finishes and
      # fails the step if it fails (the services are then untouched; re-run the deploy).
      # Skipped without PARTITION_MAINTENANCE_JOB.
      - name: Update and run partition maintenance job
        if: env.PARTITION_MAINTENANCE_JOB != ''
        timeout-minutes: 10
        run: |
          gcloud run jobs update "$PARTITION_MAINTENANCE_JOB" --image "${REGISTRY}/ingestion:${SHA}" \
            --project "$PROJECT_ID" --region "$REGION" --quiet
          gcloud run jobs execute "$PARTITION_MAINTENANCE_JOB" --wait \
            --project "$PROJECT_ID" --region "$REGION" --quiet

      # --- 3. Services (only reached if the migration succeeded) --------------------------------
      - name: Deploy nextera-api
        run: |
          gcloud run deploy nextera-api --image "${REGISTRY}/api:${SHA}" \
            --project "$PROJECT_ID" --region "$REGION" --quiet

      - name: Deploy nextera-ingestion
        run: |
          gcloud run deploy nextera-ingestion --image "${REGISTRY}/ingestion:${SHA}" \
            --project "$PROJECT_ID" --region "$REGION" --quiet

      # --- 4. Angular app (only reached if the API deploy succeeded) ----------------------------
      # The revision fails its startup probe (and traffic stays on the old one) if API_BASE_URL,
      # set by Terraform, is invalid: the container validates it before nginx starts.
      - name: Deploy nextera-web
        run: |
          gcloud run deploy nextera-web --image "${REGISTRY}/web:${SHA}" \
            --project "$PROJECT_ID" --region "$REGION" --quiet

      # --- 5. Demo feed job (optional; demo-feed.tf) ----------------------------------------------
      # Same ingestion image; the next Cloud Scheduler tick runs it. Skipped without DEMO_FEED_JOB.
      - name: Update demo feed job
        if: env.DEMO_FEED_JOB != ''
        run: |
          gcloud run jobs update "$DEMO_FEED_JOB" --image "${REGISTRY}/ingestion:${SHA}" \
            --project "$PROJECT_ID" --region "$REGION" --quiet

      # --- 6. Weather sync job (optional; weather-sync.tf) ----------------------------------------
      # Same ingestion image (node dist/weather-sync/main.js); the next Cloud Scheduler run uses it.
      # Skipped without WEATHER_SYNC_JOB.
      - name: Update weather sync job
        if: env.WEATHER_SYNC_JOB != ''
        run: |
          gcloud run jobs update "$WEATHER_SYNC_JOB" --image "${REGISTRY}/ingestion:${SHA}" \
            --project "$PROJECT_ID" --region "$REGION" --quiet

      # --- 7. Farm rollup job (optional; farm_rollup_enabled) -------------------------------------
      # Same ingestion image; the next scheduled run uses it. Skipped without FARM_ROLLUP_JOB.
      - name: Update farm rollup job
        if: env.FARM_ROLLUP_JOB != ''
        run: |
          gcloud run jobs update "$FARM_ROLLUP_JOB" --image "${REGISTRY}/ingestion:${SHA}" \
            --project "$PROJECT_ID" --region "$REGION" --quiet

      # --- 8. Live summary job (optional; before/after the services it reads their tables) --------
      # Same ingestion image. Executed once now so farm_live_summary is filled right after the
      # rollout instead of at the next schedule tick. Skipped without LIVE_SUMMARY_JOB.
      - name: Update and run live summary job
        if: env.LIVE_SUMMARY_JOB != ''
        timeout-minutes: 10
        run: |
          gcloud run jobs update "$LIVE_SUMMARY_JOB" --image "${REGISTRY}/ingestion:${SHA}" \
            --project "$PROJECT_ID" --region "$REGION" --quiet
          gcloud run jobs execute "$LIVE_SUMMARY_JOB" --wait \
            --project "$PROJECT_ID" --region "$REGION" --quiet

      # --- 9. Anomaly rollup job (optional) --------------------------------------------------------
      # Same ingestion image. The first run backfills (about 70 s at 1M turbines), later ones are
      # incremental. The services are already live here: a failure marks the deploy red but rolls
      # nothing back. Skipped without ANOMALY_ROLLUP_JOB.
      - name: Update and run anomaly rollup job
        if: env.ANOMALY_ROLLUP_JOB != ''
        timeout-minutes: 15
        run: |
          gcloud run jobs update "$ANOMALY_ROLLUP_JOB" --image "${REGISTRY}/ingestion:${SHA}" \
            --project "$PROJECT_ID" --region "$REGION" --quiet
          gcloud run jobs execute "$ANOMALY_ROLLUP_JOB" --wait \
            --project "$PROJECT_ID" --region "$REGION" --quiet
