<figure class="m-0 rounded-lg border border-line px-4 pt-3 pb-2">
  <figcaption class="flex items-baseline justify-between gap-4">
    <span class="text-sm text-muted" data-testid="chart-title">{{ title() }}</span>
    @if (last(); as last) {
      <!-- Direct label of the latest value: text ink, proportional figures. -->
      <span data-testid="latest"
        ><strong class="text-lg">{{ format(last.v) }}</strong> {{ unit() }}</span
      >
    }
  </figcaption>
  @if (kind() === 'candlestick') {
    <p class="m-0 text-xs text-muted" data-testid="candle-size">
      {{ candleLabel() }} candles · drag across the chart to zoom
    </p>
  }
  @if (overlayLabel(); as overlay) {
    <!-- Two lines in one chart: name both (a swatch and a label, never colour alone). -->
    <ul
      class="m-0 flex list-none flex-wrap gap-x-3 p-0 text-xs text-muted"
      data-testid="series-legend"
    >
      <li class="flex items-center gap-1">
        <span class="h-0.5 w-3 rounded-full bg-series" aria-hidden="true"></span>
        Turbine (measured)
      </li>
      <li class="flex items-center gap-1" data-testid="overlay-legend">
        <span class="h-0.5 w-3 rounded-full bg-series-2" aria-hidden="true"></span>
        {{ overlay }}
      </li>
    </ul>
  }
  @if (markerLegend().length) {
    <!-- The marker legend: each level shown, with a swatch and its count (never colour alone). -->
    <ul
      class="m-0 flex list-none flex-wrap gap-x-3 p-0 text-xs text-muted"
      data-testid="marker-legend"
    >
      @for (entry of markerLegend(); track entry.level) {
        <li class="flex items-center gap-1" [attr.data-level]="entry.level">
          <span
            class="size-2.5 rounded-full data-[level=error]:bg-danger data-[level=info]:bg-accent data-[level=warn]:bg-warn"
            aria-hidden="true"
            [attr.data-level]="entry.level"
          ></span>
          {{ entry.label }} <span class="text-ink tabular-nums">{{ entry.count }}</span>
        </li>
      }
    </ul>
  }
  @if (statLines().length) {
    <!-- The reference lines as text: they describe the whole time range, not a zoomed window. -->
    <dl
      class="m-0 flex flex-wrap gap-x-3 text-xs text-muted"
      title="Over the whole time range"
      data-testid="stats"
    >
      @for (line of statLines(); track line.key) {
        <div class="flex gap-1">
          <dt>{{ line.label }}</dt>
          <dd class="m-0 text-ink tabular-nums" [attr.data-testid]="'stat-' + line.key">
            {{ format(line.value) }} {{ unit() }}
          </dd>
        </div>
      }
    </dl>
  }

  <!-- Fixed height includes the x-axis band, so the card never scrolls. -->
  <div class="relative h-56">
    <div
      #plot
      class="size-full outline-offset-2"
      role="img"
      tabindex="0"
      aria-keyshortcuts="ArrowLeft ArrowRight Home End Escape"
      [attr.aria-label]="ariaLabel()"
      (keydown)="onKeydown($event)"
      (focus)="onFocus()"
      (blur)="moveTo(null)"
      (mouseleave)="moveTo(null)"
    ></div>
    @if (!visible().length) {
      <p
        class="absolute inset-0 m-0 grid place-items-center text-sm text-muted"
        data-testid="chart-empty"
      >
        No readings in this range
      </p>
    }
  </div>
</figure>
