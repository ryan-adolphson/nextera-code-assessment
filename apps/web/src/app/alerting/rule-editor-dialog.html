<h2 mat-dialog-title>{{ editing ? 'Edit alert rule' : 'Add alert rule' }}</h2>
<form [formRoot]="ruleForm">
  <mat-dialog-content>
    <!--
      The grid is a div inside mat-dialog-content, not on it: Material's unlayered
      `.mat-mdc-dialog-content { display: block }` beats Tailwind's layered `grid`, which left the
      fields stacked with no gap (labels on the field above) at their content width.
      Metric spans both columns, then Condition | Threshold, then Level; one column on phones.
      `items-start`: a field showing its error grows only itself. The selects stay native.
    -->
    <div class="grid grid-cols-1 items-start gap-4 sm:grid-cols-2" data-testid="rule-fields">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="sm:col-span-2">
        <mat-label>Metric</mat-label>
        <select matNativeControl data-testid="rule-metric" [formField]="ruleForm.metric">
          @for (m of metrics; track m.value) {
            <option [value]="m.value">{{ m.label }} ({{ m.unit }})</option>
          }
        </select>
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Condition</mat-label>
        <select matNativeControl data-testid="rule-comparison" [formField]="ruleForm.comparison">
          @for (c of comparisons; track c.value) {
            <option [value]="c.value">{{ c.label }}</option>
          }
        </select>
      </mat-form-field>

      <!-- Material's default error state: invalid and touched (submitting marks every field touched). -->
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Threshold</mat-label>
        <input
          matInput
          type="number"
          step="any"
          inputmode="decimal"
          data-testid="rule-value"
          aria-describedby="rule-value-unit"
          [formField]="ruleForm.threshold"
        />
        <span matTextSuffix class="pl-1 text-muted" id="rule-value-unit">{{ unit() }}</span>
        <mat-error data-testid="rule-value-error">{{ valueError() }}</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="sm:col-span-2">
        <mat-label>Level</mat-label>
        <select matNativeControl data-testid="rule-level-select" [formField]="ruleForm.level">
          @for (l of levels; track l.value) {
            <option [value]="l.value">{{ l.label }}</option>
          }
        </select>
      </mat-form-field>

      <!-- A switch (role=switch) named by its label; on for new rules. -->
      <div class="sm:col-span-2">
        <mat-slide-toggle
          data-testid="rule-enabled"
          aria-describedby="rule-enabled-hint"
          [formField]="ruleForm.enabled"
        >
          Enabled
        </mat-slide-toggle>
        <p class="m-0 mt-1 text-sm text-muted" id="rule-enabled-hint">
          Disabled rules are kept, but new readings aren’t checked against them.
        </p>
      </div>

      @if (error(); as error) {
        <p
          class="m-0 rounded-md bg-danger-bg px-3 py-2 text-sm text-danger sm:col-span-2"
          role="alert"
          data-testid="rule-error"
        >
          {{ error }}
        </p>
      }
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton="outlined" type="button" mat-dialog-close>Cancel</button>
    <button matButton="filled" type="submit" data-testid="rule-save" [disabled]="saving()">
      {{ saving() ? 'Saving…' : editing ? 'Save changes' : 'Add rule' }}
    </button>
  </mat-dialog-actions>
</form>
