<a
  href="#content"
  class="sr-only rounded-md bg-page px-3 py-2 focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[2000]"
  >Skip to content</a
>

<!-- `data-fill` (route data `fillViewport`): the page fills exactly the window height, as a flex
     column, and scrolls inside itself; otherwise the window scrolls. -->
<div
  class="group/shell data-fill:flex data-fill:h-dvh data-fill:flex-col md:flex md:min-h-dvh md:data-fill:flex-row"
  data-testid="shell"
  [attr.data-fill]="fillViewport() ? '' : null"
>
  <aside
    class="shrink-0 border-b border-line bg-surface md:sticky md:top-0 md:h-dvh md:w-56 md:shrink-0 md:overflow-y-auto md:border-r md:border-b-0"
    data-testid="sidebar"
  >
    <div class="flex items-center gap-3 px-4 py-3 md:flex-col md:items-start md:py-5">
      <a
        routerLink="/farms"
        class="text-lg font-bold whitespace-nowrap text-ink no-underline hover:no-underline"
        data-testid="brand"
        >Nextera <span class="hidden font-normal text-muted sm:inline">Wind fleet</span></a
      >
      <span
        class="group ml-auto inline-flex items-center gap-2 rounded-full bg-page px-3 py-1 text-sm whitespace-nowrap md:ml-0"
        role="status"
        data-testid="live-status"
        [attr.data-status]="store.liveStatus()"
      >
        <span
          class="size-2 rounded-full bg-warn group-data-[status=offline]:bg-danger group-data-[status=open]:bg-ok"
          aria-hidden="true"
        ></span>
        {{ liveLabel() }}
      </span>
      <!-- md:hidden! — Material's (unlayered) icon-button display would beat the utility. -->
      <button
        #menuButton
        matIconButton
        type="button"
        class="shrink-0 md:hidden!"
        aria-controls="main-nav"
        data-testid="nav-toggle"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <mat-icon class="size-6!" [svgIcon]="menuOpen() ? 'close' : 'menu'" />
        <span class="sr-only">Menu</span>
      </button>
    </div>

    <nav
      id="main-nav"
      aria-label="Main"
      class="hidden border-t border-line px-2 py-2 data-open:block md:block md:border-t-0"
      data-testid="main-nav"
      [attr.data-open]="menuOpen() ? '' : null"
    >
      <ul class="grid gap-1">
        @for (item of navItems; track item.id) {
          <li>
            <a
              class="flex items-center gap-3 rounded-md border-l-3 border-transparent px-3 py-2 text-ink no-underline hover:bg-page hover:no-underline aria-[current=page]:border-accent aria-[current=page]:bg-page"
              [routerLink]="item.path"
              routerLinkActive="font-semibold"
              ariaCurrentWhenActive="page"
              [attr.data-testid]="'nav-' + item.id"
            >
              <mat-icon class="size-5! shrink-0 text-muted!" [svgIcon]="item.icon" />
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>
  </aside>

  <main
    id="content"
    class="min-w-0 flex-1 px-4 py-6 group-data-fill/shell:flex group-data-fill/shell:min-h-0 group-data-fill/shell:flex-col group-data-fill/shell:overflow-y-auto md:px-8 md:py-8"
  >
    <div
      class="mx-auto max-w-7xl group-data-fill/shell:flex group-data-fill/shell:min-h-0 group-data-fill/shell:w-full group-data-fill/shell:flex-1 group-data-fill/shell:flex-col"
    >
      @if (store.error(); as error) {
        <p class="mb-4 rounded-lg bg-danger-bg px-4 py-3 text-danger" role="alert">{{ error }}</p>
      }

      @if (store.loading()) {
        <p class="text-muted">Loading fleet…</p>
      } @else {
        <router-outlet />
      }
    </div>
  </main>
</div>
